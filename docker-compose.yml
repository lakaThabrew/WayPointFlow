services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint
      POSTGRES_DB: waypointflow
    ports:
      - "55432:5432"  # host port 55432 — host PostgreSQL 18 already occupies 5432/5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypointflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # wait until Postgres accepts connections — plain "depends_on" races the first migration
    environment:
      DATABASE_URL: postgresql://waypoint:waypoint@db:5432/waypointflow?schema=public
      PORT: 4000
      JWT_SECRET: change-in-production
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s   # first boot runs migrations + seed before the API answers
    command: >
      sh -c "npm run db:migrate:deploy && node dist/prisma/seed.js && node dist/src/index.js"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy   # nginx resolves "api" at config load, so wait for it
    ports:
      - "8080:80"

volumes:
  pgdata:
