name: CI Build & Test Checker

on:
  push:
    branches:
      - main
      - lakmana-development
  pull_request:
    branches:
      - main
      - lakmana-development

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ---- Frontend (Web) ----
      - name: Install Frontend Dependencies
        run: npm ci

      - name: Typecheck Frontend
        run: npm run typecheck
        
      - name: Build Frontend
        run: npm run build

      - name: Run Frontend Tests
        run: npm test --if-present

      # ---- Backend (API) ----
      - name: Install API Dependencies
        working-directory: ./api
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./api
        run: npx prisma generate

      - name: Build API
        working-directory: ./api
        run: npm run build

      - name: Run API Tests
        working-directory: ./api
        run: npm test --if-present

  docker-build-checker:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Compose Build
        run: |
          docker compose build
          
      - name: Verify API Container Boots
        run: |
          docker compose up -d
          # Give it 30 seconds for the database and prisma migrations to boot
          sleep 30
          # Display container status for debugging
          docker compose ps
          # Verify Health endpoints
          curl -f http://localhost:4000/health || exit 1
          docker compose down
