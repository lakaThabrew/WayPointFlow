name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ---- Frontend ----
      - name: Install Frontend Dependencies
        run: npm ci

      # tsc runs first: `vite build` alone strips types without checking them,
      # so type errors would otherwise reach main unnoticed.
      - name: Typecheck Frontend
        run: npm run typecheck

      - name: Build Frontend
        run: npx vite build

      - name: Run Frontend Tests
        run: npm test --if-present

      # ---- Backend (API) ----
      - name: Install API Dependencies
        working-directory: ./api
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./api
        run: npx prisma generate

      - name: Build API
        working-directory: ./api
        run: npm run build

      - name: Run API Tests
        working-directory: ./api
        run: npm test --if-present
